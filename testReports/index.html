<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Quiz Sessions</title><style>body{font-family:Arial, sans-serif;margin:0;background:#f7f7f7;color:#222;}header{background:#1f2937;color:#fff;padding:12px 16px;}main{display:flex;height:calc(100vh - 52px);}aside{width:320px;overflow:auto;border-right:1px solid #ccc;background:#fff;}section{flex:1;overflow:auto;padding:16px;}ul{list-style:none;padding:0;margin:0;}li{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;}li:hover{background:#f0f0f0;}li.active{background:#e0f2ff;}table{border-collapse:collapse;width:100%;margin-top:12px;}th,td{border:1px solid #ccc;padding:6px 8px;vertical-align:top;}th{background:#ececec;}tr:nth-child(even){background:#fcfcfc;}code{white-space:pre-wrap;display:block;} .ok{color:#0a0;} .bad{color:#c00;} .miss{color:#999;}</style></head><body><header><h2>Quiz Sessions</h2></header><main><aside><ul id='sessionList'></ul></aside><section><div id='details'>Loading sessions…</div></section><script>async function loadIndex(){const res=await fetch('sessions-index.json');if(!res.ok){details.innerHTML='No sessions.';return;}const sessions=await res.json();renderList(sessions);} const ul=document.getElementById('sessionList');const details=document.getElementById('details');async function renderList(sessions){ul.innerHTML='';sessions.forEach((s,i)=>{const li=document.createElement('li');const pct=s.total?((s.correct*100)/s.total).toFixed(1):'0.0';li.textContent=`${s.mode.toUpperCase()} | ${s.focus}/${s.subfocus} | ${s.completed?'done':'in-progress'} | ${pct}% | ${new Date(s.createdAt).toLocaleString()}`;li.onclick=()=>select(s,i);li.id='sess-'+i;ul.appendChild(li);}); if(sessions.length>0) select(sessions[0],0);} async function select(sess,i){document.querySelectorAll('#sessionList li').forEach(e=>e.classList.remove('active'));const li=document.getElementById('sess-'+i);if(li)li.classList.add('active');const res=await fetch(sess.file);if(!res.ok){details.innerHTML='Could not load session file.';return;}const s=await res.json();let html=`<h3>${s.mode.toUpperCase()} – ${s.focus}/${s.subfocus}</h3>`;const pct=s.total?((s.correct*100)/s.total).toFixed(1):'0.0';html+=`<p><b>ID:</b> ${s.id} &nbsp; <b>Created:</b> ${new Date(s.createdAt).toLocaleString()} &nbsp; <b>Status:</b> ${s.completed?'Completed':'In-progress'}<br><b>Score:</b> ${s.correct}/${s.total} (${pct}%)</p>`;html+="<table><tr><th>#</th><th>Category</th><th>Question</th><th>Choices</th><th>Correct</th><th>Your Answer</th><th>Status</th></tr>";s.questions.forEach(q=>{const correct=q.correctIndex;const ua=q.userAnswer;const status=ua<0?'<span class=miss>Unanswered</span>':(ua===correct?'<span class=ok>Correct</span>':'<span class=bad>Incorrect</span>');html+=`<tr><td>${q.idx}</td><td>${q.category}</td><td><code>${escapeHtml(q.text)}</code></td><td>`;q.choices.forEach((c,j)=>{html+=`<div>${String.fromCharCode(65+j)}) ${escapeHtml(c)}</div>`;});html+=`</td><td>${String.fromCharCode(65+correct)}) ${escapeHtml(q.choices[correct])}</td>`;if(ua>=0&&ua<q.choices.length){html+=`<td>${String.fromCharCode(65+ua)}) ${escapeHtml(q.choices[ua])}</td>`;}else{html+='<td>Unanswered</td>'; } html+=`<td>${status}</td></tr>`;});html+='</table>';details.innerHTML=html;} function escapeHtml(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));}loadIndex();</script></main></body></html>
